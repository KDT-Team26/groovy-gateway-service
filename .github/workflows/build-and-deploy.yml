# Phase 06(Groovy GitOps 빌드 지시서) — main 실배포 CI. dev 전용 테스트 CI(contract-test.yml)와 달리
# main에 push될 때만 이미지를 빌드해 Docker Hub(ttt103 계정)에 push하고, groovy-infra의 배포
# 태그를 갱신한다. 이 워크플로가 CI(이미지 빌드)와 CD(ArgoCD가 groovy-infra의 main을 감시)를
# 잇는 연결고리다.
#
# TODO(폴리레포 전환 — 후속 작업):
#   - ApiGatewayApplicationTests(@SpringBootTest 컨텍스트 로드 테스트)가 CI에 아직 안 붙어있다.
#     groovy-infra와의 통합 테스트 인프라(서비스 컨테이너 도입 여부)가 아직 정해지지 않아 보류한다.
#   - 이 서비스는 event-contract를 의존하지 않으므로 계획서 3장(event-contract 스키마 검증)은
#     해당 사항 없음 — notification-service 워크플로우의 contract-test job과 대칭되는 항목이
#     여기 없는 이유.
name: Gateway Build and Push

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read

jobs:
  gateway:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push gateway image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          secrets: |
            gpr_actor=${{ github.actor }}
            gpr_token=${{ secrets.GPR_TOKEN }}
          # sha 태그만 쓴다(:latest 같은 가변 태그 없음) — GitOps는 groovy-infra의 values.yaml에
          # 박힌 정확한 태그로만 배포 대상을 판단하므로, 가변 태그가 있으면 오히려 혼란만 준다.
          # Docker Hub 리포지토리명은 groovy-gateway-service(이 레포명과 동일) — helm 차트 이름
          # (api-gateway)과는 다르니 혼동하지 않는다.
          tags: ttt103/groovy-gateway-service:${{ github.sha }}
          cache-from: type=gha,scope=gateway
          cache-to: type=gha,mode=max,scope=gateway

      # 여기서부터 CD 연결 — groovy-infra의 main 브랜치에 있는 api-gateway 차트의 values.yaml
      # 이미지 태그를 새로 push한 sha로 갱신해 커밋한다. ArgoCD가 groovy-infra main을 감시
      # 중이므로, 이 커밋 하나가 실제 클러스터 배포를 트리거한다. GITHUB_TOKEN은 이 레포에만
      # 범위가 있어 다른 레포에 못 쓰므로, groovy-infra 쓰기 권한이 있는 별도 PAT(INFRA_REPO_PAT)가
      # 필요하다 — Docker Hub 토큰과 마찬가지로 레포 소유자가 직접 발급해서 시크릿으로 등록해야 한다.
      - name: Checkout groovy-infra
        uses: actions/checkout@v4
        with:
          repository: KDT-Team26/groovy-infra
          ref: main
          token: ${{ secrets.INFRA_REPO_PAT }}
          path: groovy-infra

      - name: Bump image tag in groovy-infra
        working-directory: groovy-infra
        run: |
          sed -i -E "s/^(    tag: ).*/\1\"${{ github.sha }}\"/" helm/api-gateway/values.yaml
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add helm/api-gateway/values.yaml
          if git diff --cached --quiet; then
            echo "이미지 태그가 이미 최신 상태라 커밋할 변경 사항이 없습니다."
          else
            git commit -m "chore(api-gateway): bump image tag to ${{ github.sha }}"
            git push
          fi
