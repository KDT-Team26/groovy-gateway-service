# dev 브랜치 전용 CI — 맥북(arm64) 로컬 테스트용 이미지만 빌드
name: ARM64 Dev Image Build

on:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  build-arm64:
    runs-on: ubuntu-24.04-arm # Public 레포 무료 arm64 네이티브 러너 — QEMU 에뮬레이션 없이 네이티브로 빌드해 속도를 개선한다
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push arm64 image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/arm64 # 로컬 개발 환경(맥북)만 겨냥하므로 amd64는 만들지 않는다
          tags: ttt103/groovy-gateway-service:latest # 로컬 개발용이라 sha 태그 없이 latest 하나만 유지(push할 때마다 자동으로 덮어써짐)
          cache-from: type=gha,scope=gateway-service-arm64
          cache-to: type=gha,mode=max,scope=gateway-service-arm64