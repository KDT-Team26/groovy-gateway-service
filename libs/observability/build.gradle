// 공유해도 되는 것(로깅/observability 설정)만 담는다. Business Service/Entity는 절대 넣지 않는다
// (Groovy_MSA_전환계획.md Phase 3 "common 모듈 경고" 참고).
plugins {
	id 'java-library'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

dependencies {
	// 이 모듈이 제공하는 observability/logback-json.xml이 참조하는 인코더.
	// api로 노출해 이 모듈에 의존하는 서비스가 별도로 다시 선언하지 않아도 되게 한다.
	api 'net.logstash.logback:logstash-logback-encoder:8.0'

	// TraceIdTurboFilter 컴파일에만 필요하다. 실제 버전은 이 모듈을 쓰는 서비스가
	// spring-boot-opentelemetry/starter-logging으로 이미 갖고 있는 걸 그대로 쓴다
	// (compileOnly라 이 모듈이 별도 버전을 강제하지 않는다).
	compileOnly 'io.opentelemetry:opentelemetry-api:1.62.0'
	compileOnly 'ch.qos.logback:logback-classic:1.5.34'

	// HttpStatusObservationFilter 컴파일에만 필요하다 — 위와 같은 이유로 compileOnly.
	compileOnly 'io.micrometer:micrometer-observation:1.17.0'
	compileOnly 'org.springframework:spring-web:7.0.8'
	compileOnly 'jakarta.servlet:jakarta.servlet-api:6.1.0'
}
